<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Sports Com · Contingent Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F0;--surface:#FFFFFF;--ink:#182219;--ink2:#37443A;--muted:#66736A;--faint:#8C978F;
  --line:#DCE1DD;--line2:#E8ECE8;--hover:#EEF1EE;
  --brand:#1B5A39;--brand-h:#134A2F;--brand-soft:#EEF5F0;--brand-soft2:#D6E7DC;--on-brand:#FFFFFF;
  --head:#0E3A25;--head-mute:#AECFBA;--head-hover:#134A2F;
  --bib:#FCD53F;--bib-h:#FFE066;--bib-soft:#FFF0A8;--bib-bg:#FFF9DB;--bib-ink:#4d3b00;--on-bib:#0A2A1B;
  --red:#B91C1C;--red-h:#991B1B;--red-soft:#FEE2E2;--red-ink:#7f1d1d;--blue-soft:#E0F2FE;--blue-ink:#0c4a6e;--ok:#1B5A39;
  --shadow:0 18px 50px rgba(10,42,27,.28);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1410;--surface:#151F19;--ink:#E6EEE8;--ink2:#C4CFC7;--muted:#93A197;--faint:#6F7E74;
  --line:#2B3830;--line2:#222D26;--hover:#1C2921;
  --brand:#2F7A52;--brand-h:#3E8A5F;--brand-soft:#1A2A20;--brand-soft2:#24382B;
  --head:#0A1F15;--head-hover:#153323;--bib-soft:#5c4a0a;--bib-bg:#2A2408;--bib-ink:#FFE9A0;
  --red:#F87171;--red-h:#EF4444;--red-soft:#3B1717;--red-ink:#FECACA;--blue-soft:#0F2A3A;--blue-ink:#BAE6FD;--ok:#7FC79C;
  --shadow:0 18px 50px rgba(0,0,0,.6);color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#0D1410;--surface:#151F19;--ink:#E6EEE8;--ink2:#C4CFC7;--muted:#93A197;--faint:#6F7E74;
  --line:#2B3830;--line2:#222D26;--hover:#1C2921;
  --brand:#2F7A52;--brand-h:#3E8A5F;--brand-soft:#1A2A20;--brand-soft2:#24382B;
  --head:#0A1F15;--head-hover:#153323;--bib-soft:#5c4a0a;--bib-bg:#2A2408;--bib-ink:#FFE9A0;
  --red:#F87171;--red-h:#EF4444;--red-soft:#3B1717;--red-ink:#FECACA;--blue-soft:#0F2A3A;--blue-ink:#BAE6FD;--ok:#7FC79C;
  --shadow:0 18px 50px rgba(0,0,0,.6);color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html,body{height:auto}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Big Shoulders Display',Impact,'Arial Narrow',sans-serif;letter-spacing:.02em;margin:0;line-height:1;color:var(--head-t,var(--brand-h))}
:root[data-theme=dark] h1,:root[data-theme=dark] h2{--head-t:#CFE6D8}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) h1,:root:not([data-theme=light]) h2{--head-t:#CFE6D8}}
h1{font-size:clamp(36px,6vw,52px);font-weight:800}h2{font-size:26px;font-weight:700}
p{margin:0}a{color:var(--brand);font-weight:600}
code{background:var(--hover);padding:1px 5px;border-radius:5px;font-size:.9em}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
::selection{background:var(--bib);color:#0A2A1B}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)}.faint{color:var(--faint)}.sm{font-size:14px}.strong{font-weight:700}.big{font-family:'Big Shoulders Display',Impact,sans-serif;font-size:26px;font-weight:700;color:var(--brand-h)}
.num{font-variant-numeric:tabular-nums}.center{text-align:center;display:flex;gap:8px;align-items:center;justify-content:center;padding:64px 16px}
.hint{font-size:12.5px;color:var(--muted)}.err{color:var(--red);font-size:13px;font-weight:600}.okc{color:var(--ok);font-size:13px;font-weight:600}
.mt{margin-top:12px}.mb{margin-bottom:20px}.ml{margin-left:8px}.pad{padding:20px}.grow{flex:1;min-width:0}.right{text-align:right;white-space:nowrap}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.ic{width:16px;height:16px;flex:none}
.row{display:flex;align-items:center}.row.wrap{flex-wrap:wrap}.row.gap{gap:10px}.row.gap-lg{gap:8px 32px}.row.gap-sm{gap:6px}.row.between{justify-content:space-between}.row.end{justify-content:flex-end}.row.bottom{align-items:flex-end}
.stack{display:flex;flex-direction:column;gap:14px}.stack-lg{display:flex;flex-direction:column;gap:24px}.stack-sm{display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.span2{grid-column:1/-1}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:9px;padding:10px 16px;font:600 15px/1.2 inherit;font-family:inherit;cursor:pointer;transition:background .15s,border-color .15s;text-decoration:none}
.btn-sm{padding:6px 12px;font-size:14px}
.btn:disabled{cursor:not-allowed;opacity:.55}
.btn-primary{background:var(--brand);color:var(--on-brand)}.btn-primary:not(:disabled):hover{background:var(--brand-h)}
.btn-accent{background:var(--bib);color:var(--on-bib)}.btn-accent:not(:disabled):hover{background:var(--bib-h)}
.btn-secondary{background:var(--surface);border-color:var(--line);color:var(--ink)}.btn-secondary:not(:disabled):hover{background:var(--hover)}
.btn-ghost{background:transparent;color:var(--ink2)}.btn-ghost:not(:disabled):hover{background:var(--hover)}
.btn-danger{background:var(--red);color:#fff}.btn-danger:not(:disabled):hover{background:var(--red-h)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;border:0;background:transparent;color:var(--muted);padding:8px;border-radius:8px;cursor:pointer}
.icon-btn:hover{background:var(--hover)}.icon-btn.danger:hover{background:var(--red-soft);color:var(--red)}.icon-btn.faint{cursor:default;color:var(--faint)}.icon-btn.faint:hover{background:transparent}
.icon-btn.inv{color:#D6E7DC}.icon-btn.inv:hover{background:var(--head-hover)}
.link{background:none;border:0;color:inherit;font:inherit;font-weight:700;cursor:pointer;display:inline-flex;gap:6px;align-items:center;text-decoration:underline;text-underline-offset:3px}
.spin{width:15px;height:15px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:sp .7s linear infinite}
.spin.dark{color:var(--muted)}@keyframes sp{to{transform:rotate(360deg)}}

/* header */
.top{background:var(--head);color:#fff}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:8px 28px;padding-top:12px;padding-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none}
.brand span{font-family:'Big Shoulders Display',Impact,sans-serif;font-size:25px;font-weight:700;letter-spacing:.03em;line-height:1}
.brand em{font-style:normal;font-weight:500;color:var(--head-mute);margin-left:8px}
.mainnav{display:flex;gap:4px;flex:1;overflow-x:auto;order:3;width:100%}
@media (min-width:720px){.mainnav{order:0;width:auto}}
.nlink{display:flex;align-items:center;gap:8px;white-space:nowrap;padding:8px 12px;border-radius:9px;color:#D6E7DC;text-decoration:none;font-size:14px;font-weight:600}
.nlink:hover{background:var(--head-hover)}.nlink.on{background:var(--bib);color:var(--on-bib)}
.who{margin-left:auto;display:flex;align-items:center;gap:8px}.who-t{text-align:right;line-height:1.2}.who-t p:first-child{font-size:14px;font-weight:700}.who-t p:last-child{font-size:12px;color:var(--head-mute)}
@media (max-width:560px){.who-t{display:none}}
.demobar{background:var(--bib-bg);color:var(--bib-ink);border-bottom:1px solid var(--bib);font-size:14px;padding:8px 0}
.demobar .row{gap:6px 16px}
.main{padding-top:28px;padding-bottom:64px}
.subnav,.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:24px}
.tabs{margin-bottom:20px}
.tab{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:10px 16px;font:600 15px inherit;font-family:inherit;color:var(--muted);cursor:pointer;white-space:nowrap;text-decoration:none}
.tab:hover{color:var(--ink)}.tab.on{color:var(--brand);border-bottom-color:var(--brand)}
:root[data-theme=dark] .tab.on{color:#8FCFAA;border-bottom-color:#8FCFAA}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .tab.on{color:#8FCFAA;border-bottom-color:#8FCFAA}}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card-h{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line2)}
.sub{color:var(--muted);font-size:14px;margin-top:6px;max-width:64ch}
.page-t{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:24px}
.page-t .sub{font-size:15px;max-width:60ch}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}.stat-v{font-family:'Big Shoulders Display',Impact,sans-serif;font-size:40px;font-weight:700;line-height:1.1;color:var(--brand-h)}
:root[data-theme=dark] .stat-v,:root[data-theme=dark] .big{color:#CFE6D8}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .stat-v,:root:not([data-theme=light]) .big{color:#CFE6D8}}
.empty{padding:48px 24px;text-align:center}.empty-t{font-family:'Big Shoulders Display',Impact,sans-serif;font-size:26px;font-weight:700;color:var(--brand-h)}
.badge{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700}.badge .ic{width:12px;height:12px}
.b-n{background:var(--hover);color:var(--ink2)}.b-g{background:var(--brand-soft2);color:var(--brand-h)}.b-y{background:var(--bib-soft);color:var(--bib-ink)}.b-r{background:var(--red-soft);color:var(--red-ink)}.b-b{background:var(--blue-soft);color:var(--blue-ink)}
:root[data-theme=dark] .b-g{color:#BFE3CE}@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .b-g{color:#BFE3CE}}
.banner{display:flex;gap:12px;border:1px solid;border-radius:10px;padding:12px 14px;font-size:14px}.banner .ic{width:18px;height:18px;margin-top:1px}.bn-t{font-weight:700}
.bn-info{background:var(--blue-soft);color:var(--blue-ink);border-color:var(--blue-soft)}.bn-warn{background:var(--bib-bg);color:var(--bib-ink);border-color:var(--bib)}.bn-error{background:var(--red-soft);color:var(--red-ink);border-color:var(--red-soft)}.bn-ok{background:var(--brand-soft);color:var(--brand-h);border-color:var(--brand-soft2)}
:root[data-theme=dark] .bn-ok{color:#BFE3CE}@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .bn-ok{color:#BFE3CE}}
.bul{margin:4px 0 0;padding-left:18px}

/* forms */
.field{display:block}.lbl{display:block;font-size:14px;font-weight:700;margin-bottom:4px}.req{color:var(--red)}.field .hint,.field .err{display:block;margin-top:4px}
.input{display:block;width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:9px 12px;font:15px inherit;font-family:inherit}
.input::placeholder{color:var(--faint)}.input:disabled{background:var(--hover);color:var(--ink2);cursor:not-allowed}
.input:focus-visible{outline-offset:0;border-color:var(--brand)}textarea.input{resize:vertical}
.input.auto{width:auto}.input.w-64{width:256px;max-width:100%}.input.w-56{width:224px;max-width:100%}
select.input{appearance:auto}
fieldset{border:0;border-top:1px solid var(--line2);margin:0;padding:20px 0 0}fieldset:first-of-type{border:0;padding-top:0}
fieldset.plain{border:0;padding:0}
legend{font-family:'Big Shoulders Display',Impact,sans-serif;font-size:22px;font-weight:700;color:var(--brand-h);padding:0;margin-bottom:12px}
fieldset.plain legend{font-family:inherit;font-size:14px;margin-bottom:6px;color:var(--ink)}
:root[data-theme=dark] legend{color:#CFE6D8}@media (prefers-color-scheme:dark){:root:not([data-theme=light]) legend{color:#CFE6D8}}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:6px 0}.check input{margin-top:3px;width:16px;height:16px;accent-color:var(--brand)}
.switch{position:relative;flex:none;width:48px;height:28px;border-radius:99px;border:0;background:var(--faint);cursor:pointer;transition:background .15s;padding:0}
.switch span{position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.switch.on{background:var(--brand)}.switch.on span{transform:translateX(20px)}.switch:disabled{opacity:.5;cursor:not-allowed}
.search{position:relative}.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint)}.search .input{padding-left:36px}

/* lists + tables */
.list{list-style:none;margin:0;padding:0}.list>li+li,.list>div+div{border-top:1px solid var(--line2)}
.list.bordered{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.li-row{display:flex;align-items:center;gap:14px;padding:12px 20px;flex-wrap:wrap}.list.bordered .li-row{padding:10px 14px}.li-row.top{align-items:flex-start;justify-content:space-between;padding:16px 20px}
.shirt{flex:none;width:40px;height:40px;border-radius:9px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Big Shoulders Display',Impact,sans-serif;font-size:24px;font-weight:700}
.shirt.cap{background:var(--bib);color:var(--on-bib)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;font-weight:700;color:var(--muted);padding:9px 14px;white-space:nowrap;border-bottom:1px solid var(--line2)}
td{padding:10px 14px;font-size:14px;border-top:1px solid var(--line2);vertical-align:middle}tbody tr:first-child td{border-top:0}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:14px;font-size:14px}
.code{background:var(--hover);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;font-size:12.5px;margin:8px 0}

/* roster */
.score{display:flex;align-items:baseline;gap:4px}.score-n{font-family:'Big Shoulders Display',Impact,sans-serif;font-size:72px;font-weight:800;line-height:.9;color:var(--brand)}
.score-d{font-family:'Big Shoulders Display',Impact,sans-serif;font-size:36px;font-weight:700;color:var(--faint)}.score .sm{margin-left:8px;line-height:1.2}
:root[data-theme=dark] .score-n{color:#7FC79C}@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .score-n{color:#7FC79C}}
.jerseys{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}.jerseys li{width:40px;height:44px}.jerseys svg{width:100%;height:100%}
.submit-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px}

/* overlays */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(6,22,14,.55);overflow-y:auto;display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 32px}
.modal{width:100%;max-width:520px;background:var(--bg);border-radius:14px;box-shadow:var(--shadow);margin-top:6vh}.modal.wide{max-width:880px}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--line)}.modal-b{padding:20px}
.toasts{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 16px;pointer-events:none}
.toast{pointer-events:auto;display:flex;gap:10px;align-items:flex-start;max-width:440px;background:#0A2A1B;color:#fff;border-radius:10px;padding:11px 14px;font-size:14px;box-shadow:var(--shadow)}
.toast .ic{margin-top:2px;color:var(--bib)}.toast.err .ic{color:#FCA5A5}

/* login */
.login{position:relative;min-height:100vh;min-height:100dvh;background:#134A2F;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.login .center{color:#D6E7DC}.login .spin.dark{color:#D6E7DC}
.pitch{position:absolute;inset:0;width:100%;height:100%}
.login-in{position:relative;max-width:1120px;margin:0 auto;padding:40px 24px;width:100%;display:flex;flex-wrap:wrap;gap:40px;align-items:center;justify-content:space-between}
.login-copy{max-width:560px;color:#fff}.login-copy h1{color:#fff;font-size:clamp(56px,11vw,112px);font-weight:800;line-height:.92;margin:12px 0 20px}
.kicker{display:inline-block;background:var(--bib);color:var(--on-bib);font-weight:700;font-size:14px;padding:4px 10px;border-radius:7px}
.lead{font-size:18px;color:#D6E7DC;max-width:44ch}
.login-card{width:100%;max-width:380px;background:var(--surface);border-radius:14px;padding:24px;box-shadow:var(--shadow);color:var(--ink)}
.login-card h2{font-size:32px}.login-card .sm{margin-top:4px}.login-card .banner{margin-top:14px}
.gbtn{margin-top:20px;width:100%;display:flex;align-items:center;justify-content:center;gap:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:12px 16px;font:600 16px inherit;font-family:inherit;cursor:pointer}.gbtn:hover{background:var(--hover)}
.acct{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:transparent;border:0;padding:10px 14px;font:inherit;color:inherit;cursor:pointer}.acct:hover{background:var(--hover)}
.avatar{flex:none;width:36px;height:36px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* forms editor */
.fgrid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
.fprev{position:sticky;top:12px}
@media (max-width:1020px){.fgrid{grid-template-columns:1fr}.fprev{position:static}}
.frow{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.frow-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 12px;border-bottom:1px solid var(--line2)}
.frow-h .input.grow{flex:1 1 220px;min-width:0}
.frow-b{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:14px 12px}
.frow-b:not(:has(textarea)){grid-template-columns:1fr}
@media (max-width:720px){.frow-b{grid-template-columns:1fr}}
.fnum{flex:none;width:28px;height:28px;border-radius:8px;background:var(--brand-soft2);color:var(--brand-h);font-family:'Big Shoulders Display',Impact,sans-serif;font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center}
.icon-btn:disabled{opacity:.35;cursor:not-allowed}

.livebar{background:var(--brand-soft);color:var(--brand-h);border-bottom:1px solid var(--brand-soft2);font-size:13px;padding:5px 16px;display:flex;align-items:center;gap:8px;justify-content:center}
:root[data-theme=dark] .livebar{color:#BFE3CE}@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .livebar{color:#BFE3CE}}
.livebar .dot{width:8px;height:8px;border-radius:50%;background:#22A05A;box-shadow:0 0 0 0 rgba(34,160,90,.6);animation:pulse 2s infinite}
.livebar.off{background:var(--bib-bg);color:var(--bib-ink);border-color:var(--bib)}.livebar.off .dot{background:#C99A0C;animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(34,160,90,0)}100%{box-shadow:0 0 0 0 rgba(34,160,90,0)}}
.login-card.wide{max-width:640px}.login .login-card.wide .code{color:var(--ink)}

</style>
</head>
<body>
<div id="root"></div>
<script id="config">
/* ==================================================================================
   CONFIGURATION  -  the only part of this file you need to edit
   ----------------------------------------------------------------------------------
   mode             'live' = real Firebase (production).  'demo' = sample data, no backend.
   domain           Only Google accounts on this domain can sign in.
   bootstrapAdmins  1-3 trusted STUDENT emails. They are the first admins and can add
                    more admins inside the app (Sports Com > Admins). Changing this
                    list means copying the regenerated rules again (Setup guide).

<script type="text/plain" id="firestore-rules">
rules_version = '2';

// =============================================================================
//  Sports Com – Contingent Selection Portal
//
//  Trust model
//  - Only Google accounts on the institute domain (verified) get through domainOk().
//  - A "student" is a domain user whose email exists in emailIndex/{email}
//    (seeded by an admin). Everyone else is denied everywhere.
//  - "Admin" = a few trusted STUDENTS, never a shared login:
//      * bootstrap admins: emails written into this file (edit the config block in
//        the app, re-copy these rules, publish). They can always sign in, even before
//        the roster is uploaded, and cannot be removed from inside the app.
//      * added admins: documents in admins/{email}, created by any admin inside the
//        app. Each records who added them and when. Nobody can remove themselves.
//    Bootstrap admins need no document read to be recognised, so their bulk writes
//    (roster import, publish) can use full 450-document batches. Added admins cost one
//    read per write and the app automatically uses smaller batches for them (rules
//    allow at most 20 such reads per batched request).
//  - "Captain of sport X" = sports/X.captainRollNumber == my roll number.
//  - "Vice-captain of sport X": the captain names one current roster member (never
//    themselves). The pointer is stored in rosters/X and mirrored into teamViews/X, a
//    summary holding only roll numbers, names and the coach's NAME. A vice-captain can read
//    teamViews/X for their own team, and only while Sports Com has switched on
//    systemSettings/global.viceCaptainViewEnabled. Nothing about vice-captains is stored in
//    a student-readable document, so other students cannot see who was picked before
//    publication, and a vice-captain never touches the roster itself (the coach's contact
//    and ID proof stay private to the captain and admins).
//
//  Data isolation
//  - Captains read only `directory` (rollNumber + name). Player profiles (medical,
//    kit, ID) live in playerProfiles/, readable only by the owner and admins.
//  - Rosters are readable only by that sport's captain and admins.
//  - Players learn about selection only via publishedSelections/{roll}, readable only
//    after systemSettings/global.contingentPublished == true.
// =============================================================================

service cloud.firestore {
  match /databases/{database}/documents {

    // ---------------------------------------------------------------- helpers
    function domainOk() {
      return request.auth != null
        && request.auth.token.email_verified == true
        && request.auth.token.firebase.sign_in_provider == 'google.com'
        && request.auth.token.email.lower().matches('.*@__DOMAIN_REGEX__');
    }

    function emailKey() { return request.auth.token.email.lower(); }

    // BOOTSTRAP ADMINS: generated from the config block of the portal file.
    function isBootstrapAdmin() {
      return domainOk() && emailKey() in __BOOTSTRAP_ADMINS__;
    }
    // Any admin: bootstrap (no read) or added in the app (one exists() read).
    function isAdmin() {
      return isBootstrapAdmin()
        || (domainOk() && exists(/databases/$(database)/documents/admins/$(emailKey())));
    }

    function isStudent() {
      return domainOk()
        && exists(/databases/$(database)/documents/emailIndex/$(request.auth.token.email.lower()));
    }

    function myRoll() {
      return get(/databases/$(database)/documents/emailIndex/$(request.auth.token.email.lower())).data.rollNumber;
    }

    function settings() {
      return get(/databases/$(database)/documents/systemSettings/global).data;
    }

    // A window is open when its lock flag is false and the optional deadline
    // (a timestamp) has not passed. Missing fields fail closed only if the
    // settings document itself is missing.
    function windowOpen(lockField, deadlineField) {
      let s = settings();
      return s.get(lockField, false) == false
        && (s.get(deadlineField, null) == null || request.time < s.get(deadlineField, null));
    }
    function playerFormOpen() { return windowOpen('playerRegistrationLocked', 'playerRegistrationDeadline'); }
    function rosterOpen()     { return windowOpen('rosterLocked', 'rosterDeadline'); }
    // Sports Com's master switch for vice-captain viewing (off unless explicitly turned on).
    function viceViewOn()     { return settings().get('viceCaptainViewEnabled', false) == true; }

    // Form configuration Sports Com edits under "Registration forms". Its playerKeys /
    // coachKeys lists are the ONLY answer keys the rules accept from players and captains.
    function forms() {
      return get(/databases/$(database)/documents/systemSettings/forms).data;
    }

    function sportData(sportId) {
      return get(/databases/$(database)/documents/sports/$(sportId)).data;
    }
    function isCaptainOf(sportId) {
      return isStudent() && sportData(sportId).captainRollNumber == myRoll();
    }
    function isAnyCaptain() {
      return isStudent()
        && exists(/databases/$(database)/documents/captains/$(myRoll()));
    }

    function okStr(v, minLen, maxLen) {
      return v is string && v.size() >= minLen && v.size() <= maxLen;
    }

    // ---------------------------------------------------------- roster of truth
    // studentsMaster: full pre-seeded record (admin only).
    match /studentsMaster/{roll} {
      allow read, write: if isAdmin();
    }

    // emailIndex: login lookup. A user can read ONLY their own document.
    match /emailIndex/{email} {
      allow get: if (domainOk() && email == emailKey()) || isAdmin();
      allow list: if isAdmin();
      allow write: if isAdmin();
    }

    // directory: rollNumber + name only. This is all a captain can ever see
    // about other students.
    match /directory/{roll} {
      allow get, list: if isAnyCaptain() || isAdmin();
      allow write: if isAdmin();
    }

    // captains: marker docs so rules can tell "is a captain of anything".
    match /captains/{roll} {
      allow read, write: if isAdmin();
    }

    // The client learns "am I an admin / a bootstrap admin?" by trying to read these
    // (they never exist; the rule itself is the probe), so the admin list is never
    // duplicated in JavaScript.
    match /adminCheck/probe { allow get: if isAdmin(); }
    match /adminCheck/fast  { allow get: if isBootstrapAdmin(); }

    // Added admins. Must be existing students. Any admin may add or remove; nobody may
    // remove themselves; each record says who added it.
    match /admins/{email} {
      allow get: if (domainOk() && email == emailKey()) || isAdmin();
      allow list: if isAdmin();
      allow create, update: if isAdmin()
        && email.matches('.*@__DOMAIN_REGEX__')
        && exists(/databases/$(database)/documents/emailIndex/$(email))
        && request.resource.data.email == email
        && request.resource.data.addedBy == emailKey()
        && request.resource.data.keys().hasOnly(['email', 'rollNumber', 'name', 'addedBy', 'addedAt']);
      allow delete: if isAdmin() && email != emailKey();
    }

    // ------------------------------------------------------------------ users
    match /users/{uid} {
      allow get: if (domainOk() && request.auth.uid == uid) || isAdmin();
      allow list: if isAdmin();
      allow create: if isStudent()
        && request.auth.uid == uid
        && request.resource.data.email == request.auth.token.email.lower()
        && request.resource.data.rollNumber == myRoll()
        && request.resource.data.keys().hasOnly(['uid', 'email', 'rollNumber', 'name', 'photoURL', 'createdAt', 'lastLoginAt']);
      allow update: if isStudent()
        && request.auth.uid == uid
        && request.resource.data.rollNumber == resource.data.rollNumber
        && request.resource.data.email == resource.data.email
        && request.resource.data.keys().hasOnly(['uid', 'email', 'rollNumber', 'name', 'photoURL', 'createdAt', 'lastLoginAt']);
      allow delete: if isAdmin();
    }

    // -------------------------------------------------------- global settings
    match /systemSettings/{id} {
      allow read: if isStudent() || isAdmin();
      allow write: if isAdmin();
    }

    // ----------------------------------------------------------------- sports
    // Capacity, coach permission and captain assignment are admin-only.
    match /sports/{sportId} {
      allow read: if isStudent() || isAdmin();
      allow write: if isAdmin();
    }

    // --------------------------------------------------------- player profiles
    // Name and identity fields are fixed. Every configurable question lives in the
    // `answers` map, whose keys must exist in the current form configuration.
    // (Which answers are required, and which dropdown values are valid, is checked by the
    // app; the rules guarantee no stray keys and bounded size.)
    function validProfile(d, roll) {
      return d.keys().hasOnly(['fullName', 'rollNumber', 'email', 'answers', 'submittedAt', 'updatedAt', 'updatedBy'])
        && d.keys().hasAll(['fullName', 'rollNumber', 'email', 'answers', 'submittedAt', 'updatedAt', 'updatedBy'])
        && d.rollNumber == roll
        && d.email == request.auth.token.email.lower()
        && d.updatedBy == request.auth.token.email.lower()
        && d.updatedAt == request.time
        && okStr(d.fullName, 2, 100)
        && d.answers is map
        && d.answers.size() <= 40
        && d.answers.keys().hasOnly(forms().playerKeys);
    }

    // Keyed by roll number. Only the owner and admins can read (captains cannot).
    match /playerProfiles/{roll} {
      allow get: if (isStudent() && roll == myRoll()) || isAdmin();
      allow list: if isAdmin();
      allow create: if (isStudent() && roll == myRoll() && playerFormOpen()
            && validProfile(request.resource.data, roll)
            && request.resource.data.submittedAt == request.time)
        || isAdmin();
      allow update: if (isStudent() && roll == myRoll() && playerFormOpen()
            && validProfile(request.resource.data, roll)
            && request.resource.data.submittedAt == resource.data.submittedAt)
        || isAdmin();
      allow delete: if isAdmin();
    }

    // ---------------------------------------------------------------- rosters
    // The coach is a flat map: `name` plus one key per coach question. coachKeys always
    // includes 'name'. Completeness is enforced by the app before a roster is submitted.
    function validCoach(c) {
      return c is map
        && c.size() <= 21
        && c.keys().hasOnly(forms().coachKeys)
        && c.name is string && c.name.size() <= 100;
    }

    // Structural checks a captain's write must satisfy. Capacity is checked
    // separately (withinCap) because shrinking an over-capacity roster must
    // stay possible after Sports Com lowers a cap.
    function rosterShapeOk(sportId, d) {
      let sport = sportData(sportId);
      let coachOn = d.coachEnabled == true;
      return d.keys().hasOnly([
          'sportId', 'captainRollNumber', 'members', 'memberRolls', 'coachEnabled',
          'coach', 'status', 'locked', 'submittedAt', 'updatedAt', 'updatedBy', 'viceCaptainRollNumber'
        ])
        && d.keys().hasAll([
          'sportId', 'captainRollNumber', 'members', 'memberRolls', 'coachEnabled',
          'coach', 'status', 'locked', 'updatedAt', 'updatedBy'
        ])
        && d.sportId == sportId
        && sport.captainRollNumber != null
        && d.captainRollNumber == sport.captainRollNumber
        && d.memberRolls is list && d.members is list
        && d.memberRolls.size() >= 1 && d.memberRolls.size() <= 60
        && d.members.size() == d.memberRolls.size()
        && d.memberRolls[0] == sport.captainRollNumber          // captain = permanent player #1
        && d.memberRolls.toSet().size() == d.memberRolls.size() // no duplicates
        && (d.get('viceCaptainRollNumber', null) == null           // vice-captain: a current member,
            || (d.viceCaptainRollNumber in d.memberRolls           // never the captain
                && d.viceCaptainRollNumber != sport.captainRollNumber))
        && d.status in ['draft', 'submitted']
        && d.coachEnabled is bool
        && (!coachOn || (sport.coachAllowed == true && validCoach(d.coach)))
        && (coachOn || d.coach == null)
        && d.updatedAt == request.time
        && d.updatedBy == request.auth.token.email.lower();
    }

    // Players (captain included) <= N, or N-1 when an accompanying coach is on.
    function withinCap(sportId, d) {
      return d.memberRolls.size() <= sportData(sportId).maxCapacity - (d.coachEnabled == true ? 1 : 0);
    }

    // Readable only by admins and by THAT sport's captain.
    match /rosters/{sportId} {
      allow get: if isCaptainOf(sportId) || isAdmin();
      allow list: if isAdmin();
      allow create: if (isCaptainOf(sportId) && rosterOpen()
            && rosterShapeOk(sportId, request.resource.data)
            && withinCap(sportId, request.resource.data)
            && request.resource.data.locked == false)
        || isAdmin();
      allow update: if (isCaptainOf(sportId) && rosterOpen()
            && resource.data.get('locked', false) == false          // admin per-team lock
            && request.resource.data.locked == false                // captains can't (un)lock
            && rosterShapeOk(sportId, request.resource.data)
            && (withinCap(sportId, request.resource.data)
                || request.resource.data.memberRolls.size() < resource.data.memberRolls.size()))
        || isAdmin();
      allow delete: if isAdmin();
    }

    // ------------------------------------------------------------- team views
    // A safe summary of one roster: roll numbers and names, the coach's NAME only, and the
    // vice-captain pointer. It is the ONLY roster data a vice-captain can read: their own
    // team, only while Sports Com has viewing switched on. The app writes it in the same
    // transaction/batch as the roster. A vice-captain finds their team with the query
    // where('viceCaptainRollNumber', '==', myRollNumber).
    function validTeamView(sportId, d) {
      let sport = sportData(sportId);
      return d.keys().hasOnly(['sportId', 'captainRollNumber', 'viceCaptainRollNumber', 'members', 'memberRolls',
                               'coachEnabled', 'coachName', 'status', 'updatedAt', 'updatedBy'])
        && d.keys().hasAll(['sportId', 'captainRollNumber', 'viceCaptainRollNumber', 'members', 'memberRolls',
                            'coachEnabled', 'coachName', 'status', 'updatedAt', 'updatedBy'])
        && d.sportId == sportId
        && sport.captainRollNumber != null
        && d.captainRollNumber == sport.captainRollNumber
        && d.memberRolls is list && d.members is list
        && d.memberRolls.size() >= 1 && d.memberRolls.size() <= 60
        && d.members.size() == d.memberRolls.size()
        && d.memberRolls[0] == sport.captainRollNumber
        && d.memberRolls.toSet().size() == d.memberRolls.size()
        && (d.viceCaptainRollNumber == null
            || (d.viceCaptainRollNumber in d.memberRolls && d.viceCaptainRollNumber != sport.captainRollNumber))
        && d.coachEnabled is bool
        && okStr(d.coachName, 0, 100)
        && d.status in ['draft', 'submitted']
        && d.updatedAt == request.time
        && d.updatedBy == request.auth.token.email.lower();
    }

    match /teamViews/{sportId} {
      allow get, list: if isAdmin()
        || (isStudent() && viceViewOn() && resource.data.viceCaptainRollNumber == myRoll());
      allow create, update: if isAdmin()
        || (isCaptainOf(sportId) && rosterOpen()
            && validTeamView(sportId, request.resource.data)
            && !(exists(/databases/$(database)/documents/rosters/$(sportId))
                 && get(/databases/$(database)/documents/rosters/$(sportId)).data.get('locked', false) == true));
      allow delete: if isAdmin();
    }

    // ---------------------------------------------------- published selections
    // Written by admins when they press "Publish". A player can read their own
    // document only while contingentPublished is true, so before publication
    // even the existence of the document is unobservable.
    match /publishedSelections/{roll} {
      allow get: if (isStudent() && roll == myRoll() && settings().get('contingentPublished', false) == true)
        || isAdmin();
      allow list: if isAdmin();
      allow write: if isAdmin();
    }
  }
}

</script>

function makeRules(getDb) {
  return function can(auth, op, path, next, prev) {
    if (!auth) return false;
    const email = normEmail(auth.email);
    if (!(auth.verified && auth.provider === 'google' && email.endsWith('@' + DOMAIN))) return false;
    const db = getDb(), isBoot = DEMO_BOOTSTRAP.includes(email), isAdmin = isBoot || !!db['admins/' + email];
    const idx = db['emailIndex/' + email], isStudent = !!idx, me = idx && idx.rollNumber;
    const S = db['systemSettings/global'];
    const [col, id] = path.split('/');
    const read = op === 'get' || op === 'list';
    const winOpen = (lock, dl) => !!S && S[lock] === false && (S[dl] == null || Date.now() < S[dl]);
    const sportOf = (sid) => db['sports/' + sid];
    const captainOf = (sid) => isStudent && !!sportOf(sid) && sportOf(sid).captainRollNumber === me;
    const anyCaptain = () => isStudent && !!db['captains/' + me];
    const has = (o, keys) => keys.every((k) => k in o), only = (o, keys) => Object.keys(o).every((k) => keys.includes(k));

    switch (col) {
      case 'studentsMaster': return isAdmin;
      case 'emailIndex': return op === 'get' ? isAdmin || id === email : isAdmin;
      case 'directory': return read ? isAdmin || anyCaptain() : isAdmin;
      case 'captains': return isAdmin;
      case 'adminCheck': return op === 'get' && (id === 'fast' ? isBoot : id === 'probe' ? isAdmin : false);
      case 'admins':
        if (op === 'get') return id === email || isAdmin;
        if (op === 'list') return isAdmin;
        if (op === 'delete') return isAdmin && id !== email;
        return isAdmin && id.endsWith('@' + DOMAIN) && !!db['emailIndex/' + id] && next.email === id && next.addedBy === email && only(next, ['email', 'rollNumber', 'name', 'addedBy', 'addedAt']);
      case 'systemSettings': return read ? isStudent || isAdmin : isAdmin;
      case 'sports': return read ? isStudent || isAdmin : isAdmin;
      case 'users':
        if (op === 'get') return isAdmin || id === auth.uid;
        if (op === 'list' || op === 'delete') return isAdmin;
        return isStudent && id === auth.uid && next.email === email && (op === 'create' ? next.rollNumber === me : next.rollNumber === prev.rollNumber && next.email === prev.email);
      case 'playerProfiles': {
        if (op === 'get') return isAdmin || (isStudent && id === me);
        if (op === 'list' || op === 'delete') return isAdmin;
        if (isAdmin) return true;
        if (!(isStudent && id === me && winOpen('playerRegistrationLocked', 'playerRegistrationDeadline'))) return false;
        const F = db['systemSettings/forms'];
        const ok = !!F && only(next, PROFILE_KEYS) && has(next, PROFILE_KEYS) && next.rollNumber === id && next.email === email && next.updatedBy === email
          && typeof next.fullName === 'string' && next.fullName.length >= 2 && next.fullName.length <= 100
          && next.answers && typeof next.answers === 'object' && !Array.isArray(next.answers) && Object.keys(next.answers).length <= 40 && only(next.answers, F.playerKeys);
        return ok && (op === 'create' ? typeof next.submittedAt === 'number' : next.submittedAt === prev.submittedAt);
      }
      case 'rosters': {
        if (op === 'get') return isAdmin || captainOf(id);
        if (op === 'list' || op === 'delete') return isAdmin;
        if (isAdmin) return true;
        if (!(captainOf(id) && winOpen('rosterLocked', 'rosterDeadline'))) return false;
        if (op === 'update' && prev.locked) return false;
        const sp = sportOf(id), cap = sp.captainRollNumber, d = next;
        const shape = only(d, ROSTER_KEYS) && d.sportId === id && cap != null && d.captainRollNumber === cap && Array.isArray(d.memberRolls) && Array.isArray(d.members)
          && d.memberRolls.length >= 1 && d.memberRolls.length <= 60 && d.members.length === d.memberRolls.length && d.memberRolls[0] === cap
          && new Set(d.memberRolls).size === d.memberRolls.length && (d.viceCaptainRollNumber == null || (d.memberRolls.includes(d.viceCaptainRollNumber) && d.viceCaptainRollNumber !== cap)) && ['draft', 'submitted'].includes(d.status) && typeof d.coachEnabled === 'boolean'
          && (!d.coachEnabled || (sp.coachAllowed === true && !!db['systemSettings/forms'] && d.coach && typeof d.coach === 'object' && !Array.isArray(d.coach) && typeof d.coach.name === 'string' && d.coach.name.length <= 100 && Object.keys(d.coach).length <= 21 && only(d.coach, db['systemSettings/forms'].coachKeys)))
          && (d.coachEnabled || d.coach == null) && d.updatedBy === email && d.locked === false;
        if (!shape) return false;
        const within = d.memberRolls.length <= sp.maxCapacity - (d.coachEnabled ? 1 : 0);
        return within || (op === 'update' && d.memberRolls.length < prev.memberRolls.length);
      }
      case 'teamViews': {
        const viceOn = isStudent && !!S && S.viceCaptainViewEnabled === true;
        if (op === 'get') return isAdmin || (viceOn && !!prev && prev.viceCaptainRollNumber === me);
        if (op === 'list') return isAdmin;
        if (op === 'query') return isAdmin || (viceOn && !!next && next.viceCaptainRollNumber === me); // a filtered query must match the rule
        if (op === 'delete') return isAdmin;
        if (isAdmin) return true;
        if (!(captainOf(id) && winOpen('rosterLocked', 'rosterDeadline'))) return false;
        const ros = db['rosters/' + id]; if (ros && ros.locked === true) return false;
        const sp = sportOf(id), cap = sp.captainRollNumber, d = next;
        return only(d, TEAMVIEW_KEYS) && has(d, TEAMVIEW_KEYS) && d.sportId === id && cap != null && d.captainRollNumber === cap
          && Array.isArray(d.memberRolls) && Array.isArray(d.members) && d.memberRolls.length >= 1 && d.memberRolls.length <= 60
          && d.members.length === d.memberRolls.length && d.memberRolls[0] === cap && new Set(d.memberRolls).size === d.memberRolls.length
          && (d.viceCaptainRollNumber == null || (d.memberRolls.includes(d.viceCaptainRollNumber) && d.viceCaptainRollNumber !== cap))
          && typeof d.coachEnabled === 'boolean' && typeof d.coachName === 'string' && d.coachName.length <= 100
          && ['draft', 'submitted'].includes(d.status) && d.updatedBy === email;
      }
      case 'publishedSelections':
        if (op === 'get') return isAdmin || (isStudent && id === me && !!S && S.contingentPublished === true);
        return isAdmin;
      default: return false;
    }
  };
}

function createDemoStore() {
  const DBK = 'sportscom-demo-db-v4', AUTHK = 'sportscom-demo-auth-v1';
  let db; try { db = JSON.parse(safeLS.get(DBK) || 'null'); } catch { db = null; }
  if (!db || !db['systemSettings/global'] || !db['systemSettings/forms']) db = seedDemo();
  let auth = null; try { auth = JSON.parse(safeLS.get(AUTHK) || 'null'); } catch { auth = null; }
  const watchers = new Set(), authCbs = new Set();
  const can = makeRules(() => db);
  const persist = () => safeLS.set(DBK, JSON.stringify(db));
  const inCol = (col) => Object.keys(db).filter((k) => k.startsWith(col + '/') && k.split('/').length === 2);

  const get = async (path) => { if (!can(auth, 'get', path, null, db[path])) throw permDenied(); return db[path] ? clone(db[path]) : null; };
  const list = async (col) => { if (!can(auth, 'list', col + '/_')) throw permDenied(); return inCol(col).map((k) => ({ ...clone(db[k]), id: k.split('/')[1] })); };

    try {
      if (w.kind === 'doc') { if (!can(auth, 'get', w.path, null, db[w.path])) return w.cb(null, permDenied()); w.cb(db[w.path] ? clone(db[w.path]) : null); }
      else if (w.kind === 'query') {
        if (!can(auth, 'query', w.path + '/_', { [w.field]: w.value })) return w.cb([], permDenied());
        w.cb(inCol(w.path).map((k) => ({ ...clone(db[k]), id: k.split('/')[1] })).filter((d) => d[w.field] === w.value));
      } else { if (!can(auth, 'list', w.path + '/_')) return w.cb([], permDenied()); w.cb(inCol(w.path).map((k) => ({ ...clone(db[k]), id: k.split('/')[1] }))); }
    } catch (e) { console.error(e); }
  }
  const notify = () => watchers.forEach(deliver);
  function apply(op) {
    const now = Date.now(), prev = db[op.path];
    if (op.op === 'del') { if (!can(auth, 'delete', op.path, null, prev)) throw permDenied(); delete db[op.path]; return; }
    const data = resolveTs(clone(op.data), now);
    const next = op.merge && prev ? deepMerge(clone(prev), data) : data;
    if (!can(auth, prev ? 'update' : 'create', op.path, next, prev)) throw permDenied();
    db[op.path] = next;
  }
  const watch = (kind, path, cb, extra) => {
    const w = { kind, path, cb, ...extra }; watchers.add(w);
    Promise.resolve().then(() => { if (watchers.has(w)) deliver(w); });
    return () => watchers.delete(w);
  };

  const store = {
    mode: 'demo',
    ts: TS, rm: RM, tsFrom: (ms) => ms,
    get, list,
    async set(path, data, opt) { apply({ op: 'set', path, data, merge: opt && opt.merge }); persist(); notify(); },
    async del(path) { apply({ op: 'del', path }); persist(); notify(); },
    batchLimit: 450,
    setBatchLimit(n) { this.batchLimit = n; },
    async batch(ops, onProgress) { // chunked like production; each chunk is atomic
      let done = 0;
      for (const part of chunk(ops, this.batchLimit)) {
        const snapshot = clone(db);
        try { part.forEach(apply); } catch (e) { db = snapshot; throw e; }
        persist(); notify(); done += part.length; if (onProgress) onProgress(done, ops.length);
      }
    },
    _test: { mutate(fn) { fn(db); persist(); notify(); } }, // used only by the automated tests
    /** fn(prev) -> { patch, extra: [{path, data}] }. The patch is merged into `path`; extra docs are written whole,
     *  all in one atomic step (like a Firestore transaction). */
    async update(path, fn) {
      const prev = db[path] ? clone(db[path]) : null, r = fn(prev), snapshot = clone(db);
      try { apply({ op: 'set', path, data: r.patch, merge: true }); (r.extra || []).forEach((o) => apply({ op: 'set', path: o.path, data: o.data })); }
      catch (e) { db = snapshot; throw e; }
      persist(); notify();
    },
    async count(col) { return inCol(col).length; },
    async searchDirectory(term) {
      if (!can(auth, 'list', 'directory/_')) throw permDenied();
      const t = term.trim(), digits = /\d/.test(t);
      return inCol('directory').map((k) => clone(db[k])).filter((d) => (digits ? d.rollNumber.startsWith(normRoll(t)) : d.nameLower.startsWith(t.toLowerCase()))).sort((a, b) => a.rollNumber.localeCompare(b.rollNumber)).slice(0, 8);
    },
    watchDoc: (path, cb) => watch('doc', path, cb),
    watchCol: (path, cb) => watch('col', path, cb),
    watchQuery: (col, field, value, cb) => watch('query', col, cb, { field, value }),
    reset() { db = seedDemo(); persist(); notify(); },
    auth: {
      onChange(cb) { authCbs.add(cb); Promise.resolve().then(() => cb(auth ? { ...auth } : null)); return () => authCbs.delete(cb); },
      async signIn(p) {
        const email = normEmail(p.email);
        auth = { email, uid: 'uid-' + (db['emailIndex/' + email] ? db['emailIndex/' + email].rollNumber : email), name: p.name || email, photo: null, verified: true, provider: 'google' };
        safeLS.set(AUTHK, JSON.stringify(auth)); authCbs.forEach((cb) => cb({ ...auth })); notify();
      },
      async signOut() { auth = null; safeLS.del(AUTHK); authCbs.forEach((cb) => cb(null)); notify(); },
    },
  };
  return store;
}

async function createLiveStore() {
  const V = CFG.firebaseSdkVersion || '11.10.0', base = 'https://www.gstatic.com/firebasejs/' + V + '/';
  const [A, Au, F] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);

  const provider = new Au.GoogleAuthProvider(); provider.setCustomParameters({ hd: DOMAIN, prompt: 'select_account' });
  const norm = (v) => {
    if (v && typeof v.toMillis === 'function') return v.toMillis();
    if (Array.isArray(v)) return v.map(norm);
    if (v && typeof v === 'object') { const o = {}; for (const k of Object.keys(v)) o[k] = norm(v[k]); return o; }
    return v;
  };

    mode: 'live', ts: F.serverTimestamp, rm: F.deleteField, tsFrom: (ms) => (ms == null ? null : F.Timestamp.fromMillis(ms)),
    async get(path) { const s = await F.getDoc(ref(path)); return s.exists() ? norm(s.data()) : null; },
    async list(col) { const s = await F.getDocs(F.collection(fs, col)); return s.docs.map((d) => ({ ...norm(d.data()), id: d.id })); },
    set: (path, data, opt) => F.setDoc(ref(path), data, opt && opt.merge ? { merge: true } : {}),
    del: (path) => F.deleteDoc(ref(path)),

    setBatchLimit(n) { this.batchLimit = n; },
    async batch(ops, onProgress) {

      // allows 20 per request, so their batches are small; run a few at a time to keep imports quick.
      const parts = chunk(ops, this.batchLimit), wave = this.batchLimit >= 450 ? 1 : 4;
      let done = 0;
      for (let i = 0; i < parts.length; i += wave) {
        await Promise.all(parts.slice(i, i + wave).map(async (part) => {
          const b = F.writeBatch(fs);
          part.forEach((o) => (o.op === 'del' ? b.delete(ref(o.path)) : b.set(ref(o.path), wire(o), o.merge ? { merge: true } : {})));
          await b.commit(); done += part.length; if (onProgress) onProgress(done, ops.length);
        }));

    },
    update: (path, fn) => F.runTransaction(fs, async (tx) => {
      const s = await tx.get(ref(path)); const r = fn(s.exists() ? norm(s.data()) : null);
      tx.set(ref(path), r.patch, { merge: true });
      (r.extra || []).forEach((o) => tx.set(ref(o.path), o.data)); // e.g. the vice-captain's team view, in the same transaction
    }),
    async count(col) { try { return (await F.getCountFromServer(F.collection(fs, col))).data().count; } catch { return null; } },
    async searchDirectory(term) {
      const t = term.trim(), c = F.collection(fs, 'directory');
      const q = /\d/.test(t) ? F.query(c, F.orderBy(F.documentId()), F.startAt(normRoll(t)), F.endAt(normRoll(t) + '\uf8ff'), F.limit(8))
        : F.query(c, F.orderBy('nameLower'), F.startAt(t.toLowerCase()), F.endAt(t.toLowerCase() + '\uf8ff'), F.limit(8));
      return (await F.getDocs(q)).docs.map((d) => norm(d.data()));
    },
    watchDoc: (path, cb) => F.onSnapshot(ref(path), (s) => cb(s.exists() ? norm(s.data()) : null), (e) => cb(null, e)),
    watchQuery: (col, field, value, cb) => F.onSnapshot(F.query(F.collection(fs, col), F.where(field, '==', value)), (s) => cb(s.docs.map((d) => ({ ...norm(d.data()), id: d.id }))), (e) => cb([], e)),
    watchCol: (path, cb) => F.onSnapshot(F.collection(fs, path), (s) => cb(s.docs.map((d) => ({ ...norm(d.data()), id: d.id }))), (e) => cb([], e)),
    auth: {
      onChange: (cb) => Au.onAuthStateChanged(auth, (u) => cb(u ? { email: u.email, uid: u.uid, name: u.displayName || u.email, photo: u.photoURL, verified: u.emailVerified, provider: 'google', raw: u } : null)),
      async signIn() { try { await Au.signInWithPopup(auth, provider); } catch (e) { if (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request') return; throw e; } },
      signOut: () => Au.signOut(auth),
      async refreshToken() { if (auth.currentUser) await auth.currentUser.getIdToken(true); },
    },
  };
}

class RosterError extends Error {}

/** Read-modify-write; re-applies captain-first / no-duplicates / capacity on every write. */
async function updateRoster(sport, actor, mutate) {
  await store.update('rosters/' + sport.id, (cur) => {
    const current = cur || blankRoster(sport);
    const draft = mutate({ ...current, members: [...current.members] });
    const members = normalizeMembers(sport, draft.members);
    const info = capacityInfo(sport.maxCapacity, draft.coachEnabled, members.length);
    if (draft.coachEnabled && !sport.coachAllowed) throw new RosterError('This sport does not allow an accompanying coach.');
    if (info.over && members.length >= current.members.length)
      throw new RosterError(draft.coachEnabled && !current.coachEnabled ? `Remove a player first: with a coach this team is limited to ${info.playerCap} players.` : `Roster is full (${info.playerCap} players).`);
    // Coach completeness gates the moment of SUBMITTING. Unrelated edits to an already-submitted roster (e.g. changing the
    // vice-captain after Sports Com added a coach question) must not be blocked by it.
    if (draft.status === 'submitted' && current.status !== 'submitted' && draft.coachEnabled) { const e = coachErrors(draft.coach); if (e.length) throw new RosterError(e[0]); }
    let coach = null;
    if (draft.coachEnabled) { // only keys of the CURRENT coach form; answers to removed questions are deleted
      const allowed = ['name', ...FORMS.coach.map((f) => f.key)];
      coach = emptyCoach();
      allowed.forEach((k) => { if (draft.coach && draft.coach[k] !== undefined) coach[k] = draft.coach[k]; });
      if (cur && cur.coach) Object.keys(cur.coach).forEach((k) => { if (!allowed.includes(k)) coach[k] = store.rm(); });
    }
    // The vice-captain must still be on the team and can never be the captain; removing the player clears it.
    let vice = draft.viceCaptainRollNumber || null;
    if (vice && (vice === sport.captainRollNumber || !members.some((m) => m.rollNumber === vice))) vice = null;
    const patch = {
      sportId: sport.id, captainRollNumber: sport.captainRollNumber, members, memberRolls: members.map((m) => m.rollNumber),
      viceCaptainRollNumber: vice, coachEnabled: draft.coachEnabled, coach,
      status: draft.status, locked: current.locked === true, updatedAt: store.ts(), updatedBy: actor,
    };
    if (draft.status === 'submitted' && current.status !== 'submitted') patch.submittedAt = store.ts();
    else if (draft.status === 'draft' || !cur) patch.submittedAt = null;
    // teamViews/{sport}: the only thing a vice-captain can read. Roll numbers, names, the coach's NAME; no contact/ID.
    const teamView = { sportId: sport.id, captainRollNumber: sport.captainRollNumber, viceCaptainRollNumber: vice, members, memberRolls: patch.memberRolls,
      coachEnabled: draft.coachEnabled, coachName: coach ? String(coach.name || '') : '', status: draft.status, updatedAt: store.ts(), updatedBy: actor };
    return { patch, extra: [{ path: 'teamViews/' + sport.id, data: teamView }] };
  });
}
const addMember = (sport, actor, m) => updateRoster(sport, actor, (r) => {

function captainDocOps(rolls, nextSports, studentMap) {

/** Sport + roster + captain marker doc, written together so they can never disagree. */
async function saveSport(form, ctx) {
  const name = cleanName(form.name);
  if (name.length < 2) throw new Error('Sport name is required.');
  if (!Number.isInteger(form.maxCapacity) || form.maxCapacity < 1 || form.maxCapacity > 60) throw new Error('Maximum contingent size must be a whole number between 1 and 60.');
  const id = form.id || slugify(name);
  if (!id) throw new Error('Sport name must contain letters or numbers.');
  const prev = ctx.sports.find((s) => s.id === id);
  if (!form.id && prev) throw new Error('A sport with this name already exists.');
  const roll = form.captainRoll.trim() ? normRoll(form.captainRoll) : null;
  const cap = roll ? ctx.students.get(roll) : null;
  if (roll && !cap) throw new Error(`${roll} is not in the student roster.`);
  const next = { id, name, maxCapacity: form.maxCapacity, coachAllowed: form.coachAllowed, captainRollNumber: cap ? cap.rollNumber : null, captainName: cap ? cap.name : null };
  const oldCap = prev ? prev.captainRollNumber : null;
  const existing = ctx.rosters[id];
  const kept = ((existing && existing.members) || []).filter((m) => !(oldCap && oldCap !== next.captainRollNumber && m.rollNumber === oldCap));
  const members = normalizeMembers(next, kept);
  // A vice-captain only makes sense as someone still on the roster who isn't the (possibly new) captain.
  const prevVc = existing ? existing.viceCaptainRollNumber : null;
  const nextVc = prevVc && prevVc !== next.captainRollNumber && members.some((m) => m.rollNumber === prevVc) ? prevVc : null;
  const core = { sportId: id, captainRollNumber: next.captainRollNumber, members, memberRolls: members.map((m) => m.rollNumber), viceCaptainRollNumber: nextVc, updatedAt: store.ts(), updatedBy: ctx.actor };
  const coachOn = !!(existing && existing.coachEnabled && next.coachAllowed);
  const teamView = { sportId: id, captainRollNumber: next.captainRollNumber, viceCaptainRollNumber: nextVc, members, memberRolls: core.memberRolls, coachEnabled: coachOn,
    coachName: coachOn && existing.coach ? String(existing.coach.name || '') : '', status: existing ? existing.status : 'draft', updatedAt: store.ts(), updatedBy: ctx.actor };
  const ops = [
    { op: 'set', merge: true, path: 'sports/' + id, data: { name, maxCapacity: next.maxCapacity, coachAllowed: next.coachAllowed, captainRollNumber: next.captainRollNumber, captainName: next.captainName, updatedAt: store.ts(), ...(prev ? {} : { createdAt: store.ts() }) } },
    existing
      ? { op: 'set', merge: true, path: 'rosters/' + id, data: { ...core, ...(next.coachAllowed ? {} : { coachEnabled: false, coach: null }) } }
      : { op: 'set', path: 'rosters/' + id, data: { ...blankRoster(next), ...core, submittedAt: null } },
    { op: 'set', path: 'teamViews/' + id, data: teamView },
    ...captainDocOps([oldCap, next.captainRollNumber], [...ctx.sports.filter((s) => s.id !== id), next], ctx.students),
  ];
  await store.batch(ops);
  return next;
}
async function deleteSport(sport, ctx) {
  await store.batch([{ op: 'del', path: 'sports/' + sport.id }, { op: 'del', path: 'rosters/' + sport.id }, { op: 'del', path: 'teamViews/' + sport.id }, ...captainDocOps([sport.captainRollNumber], ctx.sports.filter((s) => s.id !== sport.id), ctx.students)]);
}
/** Snapshot rosters into publishedSelections, drop stale ones, and only then flip the flag. */
async function publishContingent(sports, rosters, students, actor, onProgress) {
  const sel = buildSelections(sports, rosters, new Map(students.map((s) => [s.rollNumber, s.name])));
  const existing = await store.list('publishedSelections');
  const ops = [];
  for (const [roll, s] of sel) ops.push({ op: 'set', path: 'publishedSelections/' + roll, data: { ...s, publishedAt: store.ts() } });
  existing.forEach((d) => { if (!sel.has(d.id)) ops.push({ op: 'del', path: 'publishedSelections/' + d.id }); });
  await store.batch(ops, onProgress);
  await patchSettings({ contingentPublished: true, publishedAt: store.ts() }, actor);
  return sel.size;
}

/** Hosted-preview pages must hand files to the viewer via the `downloads` capability; standalone pages use a normal download. */
async function saveFile(filename, blob) {
  try {
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (dl) { await dl.save({ filename, data: blob }); return; }
  } catch (e) { if (e && e.code === 'declined') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}
async function exportContingent(data) {

}

const newKey = (list) => { let k; do { k = 'q' + Math.random().toString(36).slice(2, 8); } while (list.some((f) => f.key === k)); return k; };

function checkForms(cfg) {
  const errs = [];
  [['player', 'Player form', 40], ['coach', 'Coach form', 20]].forEach(([k, name, max]) => {
    const list = cfg[k];
    if (list.length > max) errs.push(`${name}: at most ${max} questions.`);
    list.forEach((f, i) => {
      if (f.label.trim().length < 2) errs.push(`${name}, question ${i + 1}: write the question text.`);
      if (f.type === 'select' && (f.options || []).length < 2) errs.push(`${name}, “${f.label || 'question ' + (i + 1)}”: a dropdown needs at least two options.`);
    });
  });

}

function FormsPage() {

class Denied extends Error { constructor(m) { super(m); this.denied = true; } }
async function resolveSession(u) {
  const email = normEmail(u.email);
  if (!(u.verified && email.endsWith('@' + DOMAIN))) throw new Denied(`Sign in with your @${DOMAIN} Google account.`);
  const dbRefused = () => new Denied('The database refused the sign-in check. If you are setting the portal up, publish the security rules first (see the setup guide).');
  const probe = (p) => store.get('adminCheck/' + p).then(() => true, (e) => { if (e && e.code === 'permission-denied') return false; throw e; });
  let idx, isAdmin, fastAdmin;
  try { [idx, isAdmin, fastAdmin] = await Promise.all([store.get('emailIndex/' + email), probe('probe'), probe('fast')]); }
  catch (e) { if (e && e.code === 'permission-denied') throw dbRefused(); throw e; }
  if (!idx && !isAdmin) throw new Denied(`${email} is not on the contingent roster. Contact Sports Com if you think this is a mistake.`);
  // Bootstrap admins are recognised without a read, so they may write 450 documents per batch; other admins 18.
  store.setBatchLimit(fastAdmin ? 450 : 18);
  let student = null;
  if (idx) {
    student = { rollNumber: idx.rollNumber, name: idx.name, email };
    try { // link the Google account to the pre-seeded record (best effort)
      const ex = await store.get('users/' + u.uid).catch(() => null);
      if (ex) await store.set('users/' + u.uid, { lastLoginAt: store.ts(), photoURL: u.photo || null, name: idx.name }, { merge: true });
      else await store.set('users/' + u.uid, { uid: u.uid, email, rollNumber: idx.rollNumber, name: idx.name, photoURL: u.photo || null, createdAt: store.ts(), lastLoginAt: store.ts() });
    } catch (e) { console.warn('users link failed', e); }
  }
  return { user: u, isAdmin, fastAdmin, student };
}

}

function Root({ setup }) {

  const [toasts, setToasts] = useState([]), [dlg, setDlg] = useState(null), resolver = useRef(null), seq = useRef(0);

  }, []);
  useEffect(() => setup ? undefined : store.auth.onChange(async (u) => {
    if (!u) { setSession({ status: 'out', error: errRef.current }); errRef.current = null; return; }

    catch (e) { errRef.current = e.denied ? e.message : 'We could not verify your account. Try again in a moment.'; if (!e.denied) console.error(e); await store.auth.signOut(); }

}
